version: '3.9'

services:
  postgres:
    image: postgres:15-alpine
    container_name: kisansetu_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: kisansetu
      POSTGRES_PASSWORD: kisansetu_secret
      POSTGRES_DB: kisansetu_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kisansetu -d kisansetu_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: kisansetu_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kisansetu_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://kisansetu:kisansetu_secret@postgres:5432/kisansetu_db
      REDIS_URL: redis://redis:6379
      JWT_SECRET: kisansetu_jwt_super_secret_2026
      JWT_EXPIRES_IN: 7d
      PORT: 4000
      NODE_ENV: development
      COMMISSION_RATE: 0.025
      HANDOFF_WINDOW_DAYS: 3
    ports:
      - "4000:4000"
    volumes:
      - ./backend:/app
      - /app/node_modules

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: kisansetu_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://localhost:4000/api
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data:
  redis_data:
