services:
  - type: web
    name: kisansetu-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npx prisma db push --accept-data-loss && node prisma/seed.js
    startCommand: node src/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: JWT_SECRET
        value: kisansetu_jwt_super_secret_2026
      - key: COMMISSION_RATE
        value: "0.025"
      - key: HANDOFF_WINDOW_DAYS
        value: "3"
      - key: DATABASE_URL
        sync: false
